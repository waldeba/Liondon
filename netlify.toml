[build]
  publish = "public"
  command = "hugo"

# Hugo version for production builds
[context.production.environment]
  HUGO_VERSION = "0.125.7"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

# Development/branch deploy environment
[context.deploy-preview.environment]
  HUGO_VERSION = "0.125.7"

[context.branch-deploy.environment]
  HUGO_VERSION = "0.125.7"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"

# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Redirect rules (if needed)
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# SPA fallback (if using single page application features)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
